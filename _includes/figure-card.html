{% assign f = include.figure %}
<figure class="figure-card" id="{{ f.id | escape }}"><a href="{{ f.image | relative_url }}" aria-label="View full-size image: {{ f.title | escape }}"><img src="{{ f.image | relative_url }}" alt="{{ f.alt | escape }}" loading="lazy"></a><figcaption><h3>{{ f.title | escape }}</h3><p>{{ f.caption | escape }}</p><dl class="metadata"><div><dt>Data scope</dt><dd>{{ f.scope | escape }}</dd></div>{% if f.sample_size %}<div><dt>Sample size</dt><dd>{{ f.sample_size | escape }}</dd></div>{% endif %}{% if f.time_range and f.time_range != '' %}<div><dt>Data time range</dt><dd>{{ f.time_range | escape }}</dd></div>{% endif %}{% if f.source_note and f.source_note != '' %}<div><dt>Source / statistical definition</dt><dd>{{ f.source_note | escape }}</dd></div>{% endif %}{% if f.limitations and f.limitations != '' %}<div><dt>Limitations</dt><dd>{{ f.limitations | escape }}</dd></div>{% endif %}</dl><span class="small">Select image to view full size.</span></figcaption></figure>
