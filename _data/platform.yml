title: Agentic BIM Common Data Environment Platform
summary: "The Agentic BIM Common Data Environment Platform (ABCDE) supports role-aware BIM design collaboration. A coordinator delegates IFC work to isolated architecture, structure and building-services agents, while the workspace records tasks, model changes and audit events."
github_url: "https://github.com/yixinhenry/agentic-bim-common-data-environment-platform"
architecture_image: ""
architecture_alt: ""
architecture_caption: ""
capabilities:
  - "Project workspaces maintain ARC, STR and MEP IFC models, including creation of missing discipline models from natural-language requests."
  - "An architecture agent can use an attached DWG drawing as a reference for evidence-based IFC generation."
  - "Single-discipline and federated model views support element selection, clash candidates and linked issue workflows."
  - "Role and discipline boundaries govern specialist tools; Cost.csv and Schedule.csv queries and IFC edits produce audit records."
