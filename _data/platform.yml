title: ABCDE Platform
summary: >-
  ABCDE (Agentic BIM Common Data Environment Platform) supports BIM collaboration
  through natural-language interaction. A Project Manager Agent coordinates
  architectural (ARC), structural (STR), and building-services (MEP) agents for
  IFC queries, model editing, and model generation. The interface combines
  interactive 3D viewing, role-specific conversations, delegated tasks, and
  WIP, Shared, Published, and Archived model states.
github_url: "https://github.com/yixinhenry/agentic-bim-common-data-environment-platform"
video_id: "StFWHwiCAeQ"
video_url: "https://youtu.be/StFWHwiCAeQ"
video_title: "ABCDE Platform demonstration"
architecture_image: ""
architecture_alt: ""
architecture_caption: ""
capabilities:
  - "IFC queries and editing through discipline agents, with selected-element context from the 3D viewer."
  - "Individual and federated model viewing, with role-controlled CDE state transitions."
  - "Cross-discipline clash candidate detection using axis-aligned bounding boxes, with issues linked to remediation tasks."
  - "Architectural IFC generation from DWG references, with optional Kimi visual analysis of CAD evidence."
  - "Initial ARC, STR, or MEP model creation from natural-language requests, followed by IFC verification and WIP registration."
  - "Separate role conversations, delegated task records, notifications, audit events, and optional cost and schedule CSV tools."
